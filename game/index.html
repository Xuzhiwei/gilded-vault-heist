<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gilded Vault Heist</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060a14; }
  #game { position: fixed; inset: 0; margin: auto; width: 100vw; height: 100vh; object-fit: contain; display: block; touch-action: none; background: #060a14; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Gilded Vault Heist: a top-down heist game. Move with WASD or arrow keys, press E to lift loot and hold E to pick the vault lock."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
